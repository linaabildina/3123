name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate missing artwork
        run: |
          python generate_assets.py

      - name: Verify assets
        shell: pwsh
        run: |
          if (!(Test-Path "roulette_background.jpg")) { throw "roulette_background.jpg was not generated" }
          if (!(Test-Path "wheel_layer.webp")) { throw "wheel_layer.webp was not generated" }

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name PerfectWorldRoulette --add-data "roulette_background.jpg;." --add-data "wheel_layer.webp;." roulette.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PerfectWorldRoulette-Windows
          path: dist/PerfectWorldRoulette.exe
